[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adamantem"
version = "0.0.1"
description = "ADAMANTEM AI TRADER - research, backtest and demo-only XAUUSD system for MT5"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10"]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mt5: requires a real Windows MT5 terminal (demo only)"]
addopts = "-m 'not mt5'"

[tool.ruff]
line-length = 100
target-version = "py311"
