name: Holdout test (frozen configuration)

# Manual run only. Runs the configuration frozen in docs/HOLDOUT.md on the untouched holdout
# year and publishes the verdict to the run summary and the backtest-results branch.

on:
  workflow_dispatch:
    inputs:
      end:
        description: "End of holdout (exclusive); later months not yet published are skipped"
        default: "2026-11-01"
      spread:
        description: "Assumed spread in $ (HistData is bid-only)"
        default: "0.25"

permissions:
  contents: write  # only used to publish results to the backtest-results branch

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: xauusd-data-${{ github.run_id }}
          restore-keys: xauusd-data-
      - run: pip install -e .
      - run: python -m adamantem.app.cli holdout --end "${{ inputs.end }}" --assumed-spread "${{ inputs.spread }}"
      - name: Save downloaded data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: xauusd-data-${{ github.run_id }}
      - name: Publish summary
        if: always()
        run: |
          f=$(ls -t reports/*.md 2>/dev/null | head -1)
          if [ -n "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Publish results to the backtest-results branch
        if: success()
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          cp reports/replay.json "$RUNNER_TEMP/results/"
          cp reports/backtest_holdout.md "$RUNNER_TEMP/results/REPORT.md"
          cd "$RUNNER_TEMP/results"
          git init -q -b backtest-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Holdout results from run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" backtest-results
