name: Backtest (exploratory, in-sample)

# Manual run only: Actions tab -> "Backtest" -> Run workflow.
# Downloads XAUUSD M1 data (HistData by default) and runs every variant/profile/spread scenario.
# The report appears in the run summary and as a downloadable artifact.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        default: "2021-11-01"
      end:
        description: "End date, exclusive (the holdout after it stays untouched)"
        default: "2025-11-01"
      source:
        description: "Data source: histdata (recommended) or dukascopy"
        default: "histdata"
      spread:
        description: "Assumed spread in $ for HistData (bid-only data)"
        default: "0.25"

permissions:
  contents: write  # only used to publish results to the backtest-results branch

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: xauusd-data-${{ github.run_id }}
          restore-keys: |
            xauusd-data-
            dukascopy-xauusd-
      - run: pip install -e .
      - run: >
          python -m adamantem.app.cli backtest
          --start "${{ inputs.start }}" --end "${{ inputs.end }}"
          --source "${{ inputs.source }}" --assumed-spread "${{ inputs.spread }}"
          --download-budget-min 70
      - name: Save downloaded data (even if the run failed)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: xauusd-data-${{ github.run_id }}
      - name: Publish summary
        if: always()
        run: |
          f=$(ls -t reports/*.md 2>/dev/null | head -1)
          if [ -n "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: backtest-report
          path: reports/
      - name: Publish results to the backtest-results branch
        if: success()
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          cp reports/replay.json "$RUNNER_TEMP/results/"
          cp "$(ls -t reports/backtest_*.md | head -1)" "$RUNNER_TEMP/results/REPORT.md"
          cd "$RUNNER_TEMP/results"
          git init -q -b backtest-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Backtest results from run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" backtest-results
