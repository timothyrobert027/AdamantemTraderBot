# ADAMANTEM AI TRADER - default configuration.
# NO credentials belong in this file (or any file in this repo).
# Local overrides go in config/local.yaml (git-ignored).

mode: backtest            # research | backtest | paper | demo  (there is no live mode)
live_trading_enabled: false

broker:
  name: vantage
  account_type: standard
  platform: mt5
  require_demo_account: true
  terminal_path: null     # set in config/local.yaml on the VPS
  symbol_pattern: "*XAU*" # resolved at runtime via symbols_get
  magic_number: 50500

instrument:
  base_symbol: XAUUSD
  entry_timeframe: M5
  trend_timeframe: H1

scanner:
  session_utc: ["07:00", "20:00"]
  rollover_block_utc: ["20:45", "22:15"]
  friday_cutoff_utc: "18:00"
  max_spread_points: null       # calibrate from Vantage demo data
  max_spread_atr_fraction: 0.10
  vol_percentile_range: [30, 95]
  vol_lookback_days: 60
  news_blackout_minutes: 30

strategy:
  name: sd_fvg_v1
  variant: FVG-A+3TP            # FVG-A..FVG-D, each also +BE and +3TP; see docs/STRATEGY.md
  zone_timeframes: [H4, H1]
  zone_model: ob_fvg            # v2: order blocks + FVGs on H1/H4 (base_impulse = v1)
  ob_max_impulse_bars: 3        # displacement must happen within 3 candles after the OB
  ob_min_displacement_atr: 1.5  # ...travel >= 1.5 ATR from the OB's far edge and leave an FVG
  ob_max_width_atr: 1.5         # OB candle range <= 1.5 ATR
  htf_fvg_min_size_atr: 0.3     # H1/H4 FVG zones: gap >= 0.3 ATR
  ob_fvg_near_atr: 0.5          # OB and FVG this close (or overlapping): keep the OB
  allow_no_zone_setups: true
  no_zone_extreme_bars: 36
  atr_period: 14
  base_max_candles: 3
  base_max_range_atr: 1.0
  base_max_body_frac: 0.5
  impulse_max_candles: 2
  impulse_min_move_atr: 2.0
  impulse_min_body_frac: 0.6
  zone_max_width_atr: 1.0
  zone_max_age_bars: {M15: 96, H1: 120, H4: 60}
  min_room_r: 2.0
  # M5 entry: inversion of the last opposing FVG, then retest
  fvg_min_size_atr: 0.15
  arm_window_bars: 36
  fvg_max_age_before_arm_bars: 24
  retest_window_bars: 12
  retest_price: edge            # edge | midpoint
  cancel_if_moved_r: 1.0
  sl_buffer_atr: 0.2
  tp_max_r: 3.0
  tp_default_r: 2.5
  time_stop_bars: 72
  breakeven_trigger_r: 1.0      # +BE variants: at +1R move the stop to entry
  breakeven_offset_r: 0.05      # ...plus 0.05R so costs are roughly covered
  tp1_r: 1.0                    # +3TP variants: TP1 at 1R
  tp2_r: 2.0                    # TP2 at 2R
  tp3_min_r: 2.5                # TP3 at the opposing zone, between 2.5R and tp_max_r
  runner_trail_atr: 1.5         # runner: trailing stop 1.5 x ATR(M5), never below TP2
  session_exit_utc: "20:30"
  trend_filter: false
  trend_ema: 200

risk:
  profile: max                  # standard | aggressive | max (backtests report all three)
  profiles:
    standard:
      risk_per_trade_pct: 1.0
      daily_loss_limit_pct: 3.0
      weekly_loss_limit_pct: 6.0
      max_drawdown_kill_pct: 15.0
      max_effective_leverage: 10.0
      min_free_margin_pct: 70.0
    aggressive:
      risk_per_trade_pct: 3.0
      daily_loss_limit_pct: 6.0
      weekly_loss_limit_pct: 12.0
      max_drawdown_kill_pct: 30.0
      max_effective_leverage: 20.0
      min_free_margin_pct: 50.0
    max:                        # user-selected high risk: demo/backtest only
      risk_per_trade_pct: 5.0
      daily_loss_limit_pct: 10.0
      weekly_loss_limit_pct: 20.0
      max_drawdown_kill_pct: 40.0
      max_effective_leverage: 50.0
      min_free_margin_pct: 50.0
  min_lot_risk_cap_pct: 5.0      # if 0.01 lot risks more than the profile's %, still trade it up to 5%
  max_open_positions: 1
  max_trades_per_day: 3
  max_consecutive_losses: 3
  min_seconds_between_orders: 60
